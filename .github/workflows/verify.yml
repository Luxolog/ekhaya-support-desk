name: Support Desk checks
on:
  push:
    branches: [main, feature/school-support-marketing-pilot]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: support-desk-checks
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      NEON_AUTH_BASE_URL: https://example.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: build-only-secret-do-not-use-in-production-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
